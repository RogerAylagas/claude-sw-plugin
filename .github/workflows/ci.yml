name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Conventions
    # Hooks can be skipped locally, so PRs re-check branch name, PR title and commit messages.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Branch name follows Conventional Branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          re='^(main|develop|(feature|feat|bugfix|fix|hotfix|release|chore)/[a-z0-9]+(\.[a-z0-9]+)*(-[a-z0-9]+(\.[a-z0-9]+)*)*)$'
          if [[ "$BRANCH" =~ $re ]]; then
            echo "Branch '$BRANCH' is valid."
          else
            echo "::error::Branch '$BRANCH' does not follow Conventional Branch: use feature/, bugfix/, hotfix/, release/ or chore/ plus a lowercase-hyphenated description (see CONTRIBUTING.md)."
            exit 1
          fi
      - name: PR title and commits follow Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|build|chore|ci|docs|style|refactor|perf|test|revert)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*$'
          status=0
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit (it becomes the squash-merge commit)."
            status=1
          fi
          while IFS= read -r subject; do
            [[ "$subject" == 'Revert "'* ]] && continue
            if [[ ! "$subject" =~ $re ]]; then
              echo "::error::Commit '$subject' is not a Conventional Commit."
              status=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$status"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: just lint
        env:
          # CI checks out main/develop on push; the branch-name hook only guards local commits.
          SKIP: no-commit-to-branch

  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Install Claude Code
        run: npm install --global --min-release-age=14 @anthropic-ai/claude-code
      - name: claude plugin validate
        run: just validate

  hook-tests:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Hook tests
        run: just test-hooks

  script-tests:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Script tests
        run: just test-scripts
        env:
          GH_TOKEN: ${{ github.token }}

  templates:
    name: Template (${{ matrix.lang }}, ${{ matrix.kind }}${{ matrix.pm && format(', {0}', matrix.pm) || '' }})
    # Renders each setup-repo template, initialises it and runs its full `just check`.
    runs-on: ubuntu-latest
    env:
      # init-project.sh looks up release dates with gh (14-day dependency rule).
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: python, kind: app }
          - { lang: python, kind: lib }
          - { lang: typescript, kind: app, pm: pnpm }
          - { lang: typescript, kind: lib, pm: npm }
          - { lang: rust, kind: app }
          - { lang: rust, kind: lib }
          - { lang: cpp, kind: app }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - uses: actions/setup-node@v7.1.0
        if: matrix.lang == 'typescript'
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@v6.1.0
        if: matrix.pm == 'pnpm'
        with:
          version: "12.16.1"
      # Rust: the runner's rustup installs the toolchain the generated rust-toolchain.toml pins.
      - name: Install clang-tidy
        if: matrix.lang == 'cpp'
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-templates-${{ runner.os }}-${{ hashFiles('skills/setup-repo/templates/**/.pre-commit-config.yaml', 'skills/setup-repo/templates/_fragments/precommit-common.yaml') }}
      - name: Smoke test
        run: just test-templates ${{ matrix.lang }} ${{ matrix.kind }} ${{ matrix.pm }}

  ci-ok:
    name: CI OK
    # Single required status check for branch protection; add new jobs to `needs`.
    if: always()
    needs: [conventions, lint, validate, hook-tests, script-tests, templates]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
