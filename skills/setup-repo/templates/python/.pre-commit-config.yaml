# Quality gate. `just setup` installs it; CI runs it via `just lint`.
# Update hook versions with `uv run pre-commit autoupdate`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
# sw:include precommit-common.yaml

  # --- Python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
