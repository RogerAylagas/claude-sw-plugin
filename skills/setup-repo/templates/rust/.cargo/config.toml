# 14-day dependency rule (AGENTS.md): Cargo never resolves a crate version published less than
# 14 days ago. Respected from Cargo 1.100; older versions ignore it.
# Urgent security fix only, one crate at a time (the lock file keeps it):
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
[registry]
global-min-publish-age = "14 days"
