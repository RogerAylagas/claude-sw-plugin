# Quality gate. `just setup` installs it; CI runs it via `just lint`.
# Update hook versions with `uvx pre-commit autoupdate`. Clippy runs in `just analyze`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
# sw:include precommit-common.yaml

  # --- Rust ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
