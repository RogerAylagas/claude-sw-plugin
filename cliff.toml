# git-cliff configuration: generates CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration
# Used by the release workflow: `git cliff --bumped-version` computes the next version and
# `git cliff --tag vX.Y.Z --output CHANGELOG.md` writes the changelog.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project
uses [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", group = "<!-- 5 -->Dependencies" },
  { message = "^revert", group = "<!-- 6 -->Reverts" },
  { message = "^(build|ci|chore|style|test)", group = "<!-- 7 -->Maintenance" },
]

[bump]
# Before 1.0.0 a breaking change bumps the minor version; from 1.0.0 on, the major version.
features_always_bump_minor = true
breaking_always_bump_major = false
# This repository starts at 1.0.0 (the plan's first release); the template default is v0.1.0.
initial_tag = "v1.0.0"
